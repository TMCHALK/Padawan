# Local Postgres for development. Production uses managed, encrypted Postgres
# (Neon/Supabase). Start with: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: padawan
      POSTGRES_PASSWORD: padawan
      POSTGRES_DB: padawan
    ports:
      - "5432:5432"
    volumes:
      - padawan_pgdata:/var/lib/postgresql/data

volumes:
  padawan_pgdata:
